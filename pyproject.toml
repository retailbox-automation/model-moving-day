[project]
name = "model-moving-day"
version = "0.1.0"
description = "Model Moving Day: an agent that moves an app's LLM calls to the smallest NVIDIA Nemotron model that still passes the app's own tests"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Token Factory Sandboxes client (Nebius); needed only to run target tests in Sandboxes
sandbox = ["contree-sdk>=0.3.6"]

[tool.setuptools]
packages = ["model_moving_day"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = ["live: calls Token Factory or Sandboxes; skipped without NEBIUS_API_KEY"]
