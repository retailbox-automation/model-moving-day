[project]
name = "model-moving-day"
version = "0.1.0"
description = "Model Moving Day: an agent that moves an app's LLM calls to the smallest NVIDIA Nemotron model that still passes the app's own tests"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["model_moving_day"]

[tool.pytest.ini_options]
testpaths = ["tests"]
