[project]
name = "model-moving-day"
version = "0.1.0"
description = "Model Moving Day: an agent that finds the LLM call sites in a repository and picks the NVIDIA Nemotron model each one needs, decided by the repository's own tests"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mmd = "model_moving_day.cli:main"

[project.optional-dependencies]
# openai: integration test that the tracer sees requests made by the real SDK (3.x sends through httpx2)
dev = ["pytest>=8", "openai>=2"]
# Token Factory Sandboxes client (Nebius); needed only to run target tests in Sandboxes
sandbox = ["contree-sdk>=0.3.6"]

[tool.setuptools]
packages = ["model_moving_day"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
markers = ["live: calls Token Factory or Sandboxes; skipped without NEBIUS_API_KEY"]
